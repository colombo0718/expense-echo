<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Echo · 依依</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="chat-page">
  <header class="chat-header">
    <div class="header-left">
      <div class="yiyi-avatar">🧮</div>
      <div class="header-titles">
        <div class="header-name">依依</div>
        <div class="header-status">對金錢鬆弛 · 對工資計較 · 替你看著</div>
      </div>
    </div>
    <div class="header-right">
      <span id="user-label" class="user-label">…</span>
      <button id="logout-btn" type="button" class="ghost">登出</button>
    </div>
  </header>

  <main id="chat-thread" class="chat-thread" aria-live="polite">
    <div class="loading">載入對話中⋯⋯</div>
  </main>

  <footer class="chat-input-bar">
    <label for="camera-input" class="icon-btn" title="拍照" aria-label="拍照">📷</label>
    <input type="file" id="camera-input" accept="image/*" capture="environment" hidden />

    <label for="gallery-input" class="icon-btn" title="從相簿選圖" aria-label="從相簿選圖">🖼️</label>
    <input type="file" id="gallery-input" accept="image/*" hidden />

    <textarea
      id="text-input"
      placeholder="跟依依說最近買了什麼?"
      rows="1"
      enterkeyhint="send"
      autocomplete="off"
    ></textarea>

    <button id="action-btn" type="button" class="icon-btn icon-btn--accent" title="錄音 / 傳送" aria-label="錄音或傳送">🎤</button>
  </footer>

  <script src="/app.js" type="module"></script>
</body>
</html>
