# Expense Echo — Cloudflare Pages 設定
# 本機開發：wrangler pages dev public
# 部署：git push（CF Dashboard 連 repo 自動觸發）
#
# 注意：Pages Functions 不需要 main entry、filesystem routing 自動 mount functions/

name = "expenseecho"
compatibility_date = "2026-05-21"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "public"

# Workers AI binding（Llama 3.2 Vision / Llama 3.1 text）
[ai]
binding = "AI"

# D1 SQLite database
# 建：wrangler d1 create expense-echo-db、拿 ID 填進來
[[d1_databases]]
binding = "DB"
database_name = "expense-echo-db"
database_id = "REPLACE_WITH_REAL_ID_AFTER_wrangler_d1_create"

# R2 object storage（收據圖片暫存）
# 建：wrangler r2 bucket create expense-echo-receipts
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "expense-echo-receipts"

# 環境變數（公開、可進 git）
[vars]
APP_NAME = "Expense Echo"
APP_URL = "https://expenseecho.pages.dev"

# Secrets 走 Pages dashboard → Settings → Environment Variables → Encrypted：
#   GOOGLE_CLIENT_ID         # LeafLune SSO OAuth Client（LL 共用）
#   GOOGLE_CLIENT_SECRET     # 同上
#   SESSION_COOKIE_SECRET    # 用來 sign cookie（HMAC）、隨機 64 chars
#
# 本機開發走 .dev.vars（在 .gitignore）、複製 .dev.vars.example 改
